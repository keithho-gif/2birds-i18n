// Live availability calendar. Pure-client demo: deterministic availability
// derived from the date so slots stay stable on reload but feel real.
const CAL_MONTH_NAMES = [
  "January","February","March","April","May","June",
  "July","August","September","October","November","December"];


// Six daily consult slots, in 24h time.
const CAL_SLOTS = [
  { t: "09:30", label: "09:30" },
  { t: "10:30", label: "10:30" },
  { t: "11:30", label: "11:30" },
  { t: "14:00", label: "14:00" },
  { t: "15:00", label: "15:00" },
  { t: "16:00", label: "16:00" }];


// Cheap deterministic hash → integer.
function calHash(y, m, d) {
  let h = (y * 73856093) ^ ((m + 1) * 19349663) ^ (d * 83492791);
  h = (h ^ h >>> 13) >>> 0;
  return h;
}

// Singapore public holidays (MOM-gazetted), keyed "YYYY-M-D" with month 0-indexed.
// Observed in-lieu Mondays are included; the practice is closed on these days.
const SG_HOLIDAYS = {
  // 2026
  "2026-0-1":  "New Year's Day",
  "2026-1-17": "Chinese New Year",
  "2026-1-18": "Chinese New Year",
  "2026-2-21": "Hari Raya Puasa",
  "2026-3-3":  "Good Friday",
  "2026-4-1":  "Labour Day",
  "2026-4-27": "Hari Raya Haji",
  "2026-4-31": "Vesak Day",          // 31 May (Sun)
  "2026-5-1":  "Vesak Day (observed)",
  "2026-7-9":  "National Day",       // 9 Aug (Sun)
  "2026-7-10": "National Day (observed)",
  "2026-10-8": "Deepavali",          // 8 Nov (Sun)
  "2026-10-9": "Deepavali (observed)",
  "2026-11-25":"Christmas Day",
  // 2027 (fixed-date holidays; lunar/Islamic dates gazetted nearer the time)
  "2027-0-1":  "New Year's Day",
  "2027-3-1":  "Labour Day",
  "2027-7-9":  "National Day",
  "2027-11-25":"Christmas Day"
};

function calHolidayName(date) {
  return SG_HOLIDAYS[date.getFullYear() + "-" + date.getMonth() + "-" + date.getDate()] || null;
}

// Availability classification for a calendar cell.
//  → "past" | "holiday" | "today-closed" | "today-open" | "weekend" | "unavailable" | "open"
function calStatus(date, today) {
  const startToday = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  const isToday = date.getTime() === startToday.getTime();
  if (date < startToday) return "past";
  if (calHolidayName(date)) return "holiday";
  const dow = date.getDay(); // 0=Sun, 6=Sat
  if (dow === 0 || dow === 6) return isToday ? "today-closed" : "weekend";

  const h = calHash(date.getFullYear(), date.getMonth(), date.getDate());
  // ~28% of weekdays are fully booked out.
  const unavailable = h % 100 < 28;
  if (isToday) return unavailable ? "today-closed" : "today-open";
  return unavailable ? "unavailable" : "open";
}

// Which of the six slots are already booked for a given date.
function calBookedSlots(date) {
  const h = calHash(date.getFullYear(), date.getMonth(), date.getDate());
  const booked = new Set();
  // Two to four slots booked per open day, deterministic by date.
  const count = 2 + h % 3;
  for (let i = 0; i < count; i++) {
    booked.add((h >> i * 3 & 7) % CAL_SLOTS.length);
  }
  return booked;
}

function MiniCal() {
  const today = useMemo(() => new Date(), []);
  const startToday = useMemo(
    () => new Date(today.getFullYear(), today.getMonth(), today.getDate()),
    [today]);

  const [view, setView] = useState(() => ({ y: today.getFullYear(), m: today.getMonth() }));
  const [picked, setPicked] = useState(null); // {y,m,d} | null

  // Don't allow paging into the past, or more than 3 months ahead
  // (current month + the next three).
  const minIndex = today.getFullYear() * 12 + today.getMonth();
  const maxIndex = minIndex + 3;
  const viewIndex = view.y * 12 + view.m;
  const canPrev = viewIndex > minIndex;
  const canNext = viewIndex < maxIndex;
  const step = (delta) => {
    const next = viewIndex + delta;
    if (next < minIndex || next > maxIndex) return;
    setView({ y: Math.floor(next / 12), m: next % 12 });
  };

  // Build grid cells: 1-indexed weekday Mon..Sun = 0..6.
  const firstDow = (new Date(view.y, view.m, 1).getDay() + 6) % 7; // shift Sun=0 → Mon=0
  const daysInMonth = new Date(view.y, view.m + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < firstDow; i++) cells.push({ kind: "empty", key: "e" + i });
  for (let d = 1; d <= daysInMonth; d++) {
    const date = new Date(view.y, view.m, d);
    cells.push({ kind: "day", d, date, status: calStatus(date, today), key: "d" + d });
  }
  // Pad to full weeks for nicer alignment.
  while (cells.length % 7 !== 0) cells.push({ kind: "empty", key: "t" + cells.length });

  const isPickedCell = (c) =>
  picked && c.kind === "day" &&
  picked.y === view.y && picked.m === view.m && picked.d === c.d;

  const onDayClick = (c) => {
    if (c.status !== "open" && c.status !== "today-open") return;
    setPicked({ y: view.y, m: view.m, d: c.d });
  };

  // Slot panel state.
  const pickedDate = picked ? new Date(picked.y, picked.m, picked.d) : null;
  const booked = pickedDate ? calBookedSlots(pickedDate) : null;
  const longDate = pickedDate ?
  pickedDate.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" }) :
  "";

  const slotMailto = (slot) => {
    const dateStr = pickedDate.toLocaleDateString("en-GB", {
      weekday: "long", day: "numeric", month: "long", year: "numeric"
    });
    const subj = encodeURIComponent(`Consultation request, ${dateStr} at ${slot.label}`);
    const body = encodeURIComponent(
      `Dear 2birds,\n\nI should like to reserve the ${slot.label} slot on ${dateStr} for a complimentary consultation.\n\nMy enquiry concerns:\n\n\nKind regards,\n`);

    return `mailto:hello@2birds.asia?subject=${subj}&body=${body}`;
  };

  return (
    <div className="tb-cal" data-i18n-skip>
      <div className="tb-cal__head">
        <span className="tb-cal__month">{CAL_MONTH_NAMES[view.m]} <em>{view.y}</em></span>
        <span className="tb-cal__nav">
          <button
            type="button"
            className="tb-cal__navbtn"
            aria-label="Previous month"
            onClick={() => step(-1)}
            disabled={!canPrev}
            style={{ opacity: canPrev ? 1 : 0.3, cursor: canPrev ? "pointer" : "not-allowed" }}>
            ‹
          </button>
          <button
            type="button"
            className="tb-cal__navbtn"
            aria-label="Next month"
            onClick={() => step(1)}
            disabled={!canNext}
            style={{ opacity: canNext ? 1 : 0.3, cursor: canNext ? "pointer" : "not-allowed" }}>
            ›
          </button>
        </span>
      </div>
      <div className="tb-cal__week">
        <span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span>
      </div>
      <div className="tb-cal__grid">
        {cells.map((c) => {
          if (c.kind === "empty") {
            return <button type="button" key={c.key} className="tb-cal__day is-empty" disabled aria-label=""></button>;
          }
          const label = c.date.toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });
          const holidayName = c.status === "holiday" ? calHolidayName(c.date) : null;
          let cls = "tb-cal__day";
          let disabled = true;
          if (c.status === "past") cls += " is-past";else
          if (c.status === "holiday") cls += " is-holiday";else
          if (c.status === "weekend") {/* default muted */}else
          if (c.status === "unavailable") cls += " is-unavailable";else
          if (c.status === "today-open") {cls += " is-today is-open";disabled = false;}else
          if (c.status === "today-closed") cls += " is-today";else
          if (c.status === "open") {cls += " is-open";disabled = false;}
          if (isPickedCell(c)) cls += " is-selected";
          return (
            <button
              type="button"
              key={c.key}
              className={cls}
              disabled={disabled}
              title={holidayName ? holidayName + " · public holiday" : undefined}
              aria-label={label + (holidayName ? ", " + holidayName + ", public holiday, closed" : c.status === "open" || c.status === "today-open" ? ", available" : "")}
              aria-pressed={isPickedCell(c) || undefined}
              onClick={() => onDayClick(c)}>

              {c.d}
            </button>);

        })}
      </div>
      <div className="tb-cal__legend">
        <span className="tb-cal__legitem"><span className="tb-cal__sw tb-cal__sw--open"></span><span>Open</span></span>
        <span className="tb-cal__legitem"><span className="tb-cal__sw tb-cal__sw--today"></span><span>Today</span></span>
        <span className="tb-cal__legitem"><span className="tb-cal__sw tb-cal__sw--picked"></span><span>Unavailable</span></span>
        <span className="tb-cal__legitem"><span className="tb-cal__sw tb-cal__sw--holiday"></span><span>Public holiday</span></span>
      </div>

      {picked &&
      <div className="tb-cal__slots">
          <div className="tb-cal__slots-head">
            <span>{longDate}</span>
            <em>Singapore time</em>
          </div>
          <div className="tb-cal__slots-grid">
            {CAL_SLOTS.map((s, i) => {
            const isBooked = booked.has(i);
            return isBooked ?
            <span key={s.t} className="tb-cal__slot is-booked" aria-disabled="true">
                  {s.label}
                </span> :

            <a key={s.t} className="tb-cal__slot" href={slotMailto(s)}>
                  {s.label}
                </a>;

          })}
          </div>
          <p className="tb-cal__slots-foot">
            Reserving an hour opens an engagement correspondence. The practice confirms by return of email, ordinarily within two working days.
          </p>
        </div>
      }
    </div>);

}

/* Hero ambient: a single large Asia-tilted wireframe globe seated
   on the right of the section, draggable. Wireframe icosahedron
   lattice + a dense hand-coded land mask (lat/lng -> 3D) so the
   rotating sphere reads as Earth focused on Asia. Drag to orbit
   with momentum easing; release and the globe keeps drifting at
   the auto-rotate speed. Brand olive only. */
function HeroAmbient() {
  const ref = React.useRef(null);
  React.useEffect(() => {
    const host = ref.current;
    if (!host || typeof THREE === "undefined") return;
    const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    const COL_LINE  = 0xC4BFA0;   // olive-light wires read on navy
    const COL_LAND  = 0xE0DAB0;   // warm cream-olive for the continents
    const COL_DUST  = 0xC4BFA0;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
    camera.position.set(0, 0.2, 12);

    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    host.appendChild(renderer.domElement);

    /* The globe — icosahedron wireframe + vertex points. */
    const globe = new THREE.Group();
    const R = 3.2;
    const ico = new THREE.IcosahedronGeometry(R, 3);  // finer mesh for Earth feel
    globe.add(new THREE.LineSegments(
      new THREE.WireframeGeometry(ico),
      new THREE.LineBasicMaterial({
        color: COL_LINE, transparent: true, opacity: 0.22
      })
    ));
    globe.add(new THREE.Points(ico, new THREE.PointsMaterial({
      color: COL_LINE, size: 0.045, transparent: true, opacity: 0.35
    })));

    /* Focused city markers — the 13 target countries / SARs the
       practice covers across Asia. Each city is a single lat/lng
       point that lights up on the globe; the rest of the world stays
       as the wireframe lattice alone. */
    const LAND = [
      // Mainland China (incl. major business centres)
      [39.9, 116.4], [31.2, 121.5], [23.1, 113.3], [30.7, 104.1],
      [22.5, 114.1], [29.6, 106.5], [36.1, 120.4], [34.3, 108.9],
      [40.8, 111.7], [45.7, 126.6], [43.8, 87.6], [32.0, 118.8],
      // Japan
      [35.7, 139.7], [34.7, 135.5], [35.0, 135.8], [43.0, 141.4], [33.6, 130.4],
      // South Korea
      [37.6, 127.0], [35.2, 129.1], [37.4, 126.6], [35.9, 128.6],
      // Hong Kong SAR
      [22.3, 114.2],
      // Singapore
      [1.35, 103.82],
      // Malaysia
      [3.1, 101.7], [5.4, 100.3], [1.5, 103.7], [5.9, 116.1], [3.0, 113.0],
      // Taiwan
      [25.0, 121.5], [22.6, 120.3], [24.1, 120.7], [23.5, 121.0],
      // Thailand
      [13.7, 100.5], [18.8, 98.9], [7.9, 98.4], [16.4, 102.8],
      // Vietnam
      [21.0, 105.8], [10.8, 106.7], [16.0, 108.2], [12.2, 109.2],
      // Indonesia
      [-6.2, 106.8], [-8.7, 115.2], [3.6, 98.7], [-7.3, 112.7], [-5.1, 119.4], [-0.5, 117.1],
      // India
      [28.6, 77.2], [19.1, 72.9], [13.0, 80.3], [12.97, 77.6], [22.6, 88.4],
      [17.4, 78.5], [23.0, 72.6], [26.8, 75.8], [11.0, 76.9],
      // Philippines
      [14.6, 120.97], [10.3, 123.9], [7.1, 125.6], [16.4, 120.6]
    ];
    function llToXYZ(lat, lng, r) {
      const phi = (90 - lat) * Math.PI / 180;
      const theta = lng * Math.PI / 180;
      return [
        r * Math.sin(phi) * Math.cos(theta),
        r * Math.cos(phi),
        r * Math.sin(phi) * Math.sin(theta)
      ];
    }
    const lp = new Float32Array(LAND.length * 3);
    LAND.forEach(([la, ln], i) => {
      const [x, y, z] = llToXYZ(la, ln, R * 1.012);
      lp[i * 3] = x; lp[i * 3 + 1] = y; lp[i * 3 + 2] = z;
    });
    const landGeo = new THREE.BufferGeometry();
    landGeo.setAttribute("position", new THREE.BufferAttribute(lp, 3));
    globe.add(new THREE.Points(landGeo, new THREE.PointsMaterial({
      // City markers — larger, brighter so they read as the focus
      color: COL_LAND, size: 0.13, transparent: true, opacity: 1.0
    })));

    /* Country labels — one per focal country, drawn on a canvas
       texture and used as a Sprite so it always faces the camera.
       Sprites are children of the globe so they rotate with it.
       Back-side labels fade via a per-frame dot-product visibility
       check (the wireframe lattice can't depth-occlude sprites, so
       we compute visibility manually instead of using an occluder
       mesh that would also hide back-side wireframe lines). */
    const COUNTRY_LABELS = [
      { name: "Mainland China",  lat:  35.0, lng: 105.0 },
      { name: "Japan",           lat:  36.0, lng: 138.0 },
      { name: "South Korea",     lat:  36.5, lng: 127.5 },
      { name: "Hong Kong SAR",   lat:  22.3, lng: 114.2 },
      { name: "Singapore",       lat:   1.35, lng: 103.82 },
      { name: "Malaysia",        lat:   4.0, lng: 101.5 },
      { name: "Taiwan",          lat:  23.7, lng: 121.0 },
      { name: "Thailand",        lat:  15.0, lng: 101.0 },
      { name: "Vietnam",         lat:  16.0, lng: 107.0 },
      { name: "Indonesia",       lat:  -3.0, lng: 113.0 },
      { name: "India",           lat:  22.0, lng:  78.0 },
      { name: "Philippines",     lat:  13.0, lng: 122.0 }
    ];
    function makeCountryLabel(text) {
      const canvas = document.createElement("canvas");
      canvas.width  = 320;
      canvas.height = 64;
      const ctx = canvas.getContext("2d");
      ctx.font = '500 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.shadowColor = "rgba(8, 12, 28, 0.95)";
      ctx.shadowBlur = 8;
      ctx.shadowOffsetX = 0;
      ctx.shadowOffsetY = 1;
      ctx.fillStyle = "#E8DEB6"; // cream-olive, brand-aligned
      ctx.fillText(text, canvas.width / 2, canvas.height / 2);
      const texture = new THREE.CanvasTexture(canvas);
      texture.needsUpdate = true;
      const material = new THREE.SpriteMaterial({
        map: texture, transparent: true, depthTest: false, depthWrite: false
      });
      const sprite = new THREE.Sprite(material);
      sprite.scale.set(1.35, 0.27, 1);
      return sprite;
    }
    const labelSprites = [];
    const connectorLines = [];
    COUNTRY_LABELS.forEach(c => {
      // Label sprite, sat just outside the lattice at 1.22R
      const [lx, ly, lz] = llToXYZ(c.lat, c.lng, R * 1.22);
      const sprite = makeCountryLabel(c.name);
      sprite.position.set(lx, ly, lz);
      globe.add(sprite);
      labelSprites.push(sprite);
      // Connector line: a thin cream-olive segment from the country's
      // city dot (at 1.012R) up to the label position. Same colour as
      // the label text so the two read as one mark on the globe.
      const [cx, cy, cz] = llToXYZ(c.lat, c.lng, R * 1.012);
      const lineGeo = new THREE.BufferGeometry();
      lineGeo.setAttribute("position", new THREE.BufferAttribute(
        new Float32Array([cx, cy, cz, lx, ly, lz]), 3
      ));
      const lineMat = new THREE.LineBasicMaterial({
        color: 0xE8DEB6, transparent: true, opacity: 0.5,
        depthTest: false
      });
      const line = new THREE.Line(lineGeo, lineMat);
      globe.add(line);
      connectorLines.push(line);
    });

    // Tilt so Asia (~100E, 25N) faces the camera; place on the right.
    globe.position.set(3.6, 0.2, -1);
    globe.rotation.y = -0.18;
    globe.rotation.x = 0.38;
    scene.add(globe);

    /* Shooting stars — short, bright line segments that streak
       diagonally across the cosmos, fade in, hold, fade out, then
       respawn at random upper-right positions. Each carries its own
       speed, tail length, delay and direction so the field never
       reads as synchronised. The focal Earth still holds the centre
       of attention; the streaks are peripheral motion. */
    function resetShootingStar(ss, initial) {
      // Spawn upper-right; streak toward lower-left like a real meteor.
      ss.userData.startX = 4 + Math.random() * 10;
      ss.userData.startY = 1.5 + Math.random() * 3.5;
      ss.userData.startZ = -4 + Math.random() * 3;
      ss.userData.dirX = -(0.9 + Math.random() * 0.4);
      ss.userData.dirY = -(0.35 + Math.random() * 0.35);
      ss.userData.trailLength = 1.4 + Math.random() * 1.8;
      ss.userData.speed = 0.10 + Math.random() * 0.10;
      ss.userData.lifeFade = 0.6;
      ss.userData.lifeHold = 3.5 + Math.random() * 2.0;
      ss.userData.lifeOut  = 0.8;
      ss.userData.progress = 0;
      ss.userData.delay = initial
        ? Math.random() * 220
        : 80 + Math.random() * 280;
      ss.material.opacity = 0;
    }
    function makeShootingStar() {
      const positions = new Float32Array(6); // head + tail vertex
      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      const mat = new THREE.LineBasicMaterial({
        color: 0xFAF8F2, transparent: true, opacity: 0
      });
      const line = new THREE.Line(geo, mat);
      line.userData = {};
      resetShootingStar(line, true);
      return line;
    }
    const shootingStars = [];
    for (let i = 0; i < 5; i++) {
      const ss = makeShootingStar();
      shootingStars.push(ss);
      scene.add(ss);
    }

    /* UNIVERSE — two-tier starfield filling the section. Tier 1 is a
       large mid-bright field of stars; Tier 2 is a smaller cluster of
       brighter "feature" stars. Spread depth is wide so the parallax
       reads as cosmos rather than confetti. */
    function makeStars(count, size, opacity, color, spreadXY, spreadZ, zOffset) {
      const pos = new Float32Array(count * 3);
      for (let i = 0; i < count; i++) {
        pos[i * 3]     = (Math.random() - 0.5) * spreadXY * 2.0;
        pos[i * 3 + 1] = (Math.random() - 0.5) * spreadXY * 1.0;
        pos[i * 3 + 2] = (Math.random() - 0.5) * spreadZ + zOffset;
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
      return new THREE.Points(g, new THREE.PointsMaterial({
        color, size, transparent: true, opacity, sizeAttenuation: true
      }));
    }
    // Distant field — many small dim stars
    const starsFar  = makeStars(600, 0.025, 0.55, 0xC4BFA0, 26, 14, -6);
    // Mid-band stars — brighter, fewer
    const starsMid  = makeStars(180, 0.045, 0.75, 0xE0DAB0, 22, 10, -3);
    // Foreground sparkle — rarest, brightest
    const starsNear = makeStars(50,  0.07,  0.95, 0xFAF8F2, 18,  6,  0);
    scene.add(starsFar);
    scene.add(starsMid);
    scene.add(starsNear);

    /* Drag-to-orbit. Pointer events arrive via the host div; we
       accumulate rotation on drag, decay velocity after release for
       momentum, and idle-spin at a slow auto-rate when nothing is
       being dragged. Pitch clamped so the visitor can't flip the
       globe upside-down. */
    let dragging = false;
    let lastX = 0, lastY = 0;
    let velY = 0, velX = 0;
    const AUTO_Y = 0.0028;

    // Drag-to-rotate is a desktop affordance only. Belt-and-braces:
    // CSS already sets pointer-events:none on the canvas at <=768px,
    // but we also gate the JS handlers against a media query so even
    // if the CSS doesn't reach (older browsers, edge layouts) the
    // handlers no-op. The MediaQueryList is re-checked at event time
    // so device rotations / window resizes apply immediately.
    const _touchMQ = window.matchMedia(
      "(max-width: 768px), (hover: none) and (pointer: coarse)"
    );
    function isTouchOnly() { return _touchMQ.matches; }
    function onPointerDown(e) {
      if (isTouchOnly()) return;
      dragging = true;
      lastX = e.clientX; lastY = e.clientY;
      velX = velY = 0;
      if (e.target.setPointerCapture && e.pointerId !== undefined) {
        try { e.target.setPointerCapture(e.pointerId); } catch (_) {}
      }
    }
    function onPointerMove(e) {
      if (!dragging) return;
      if (isTouchOnly()) { dragging = false; return; }
      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;
      lastX = e.clientX; lastY = e.clientY;
      velY = dx * 0.0055;
      velX = dy * 0.0040;
      globe.rotation.y += velY;
      globe.rotation.x += velX;
      // Clamp pitch
      const PITCH = 0.95;
      if (globe.rotation.x >  PITCH) globe.rotation.x =  PITCH;
      if (globe.rotation.x < -PITCH) globe.rotation.x = -PITCH;
      // Reduced-motion users still get drag updates: refresh labels
      // and re-render manually since the tick loop is dormant.
      if (reduce) {
        updateLabelVisibility();
        renderer.render(scene, camera);
      }
    }
    function onPointerUp() { dragging = false; }
    host.addEventListener('pointerdown', onPointerDown);
    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerUp);
    window.addEventListener('pointercancel', onPointerUp);

    function resize() {
      const w = host.clientWidth || 1, h = host.clientHeight || 1;
      renderer.setSize(w, h);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      // Mobile: the globe is purely atmospheric. Push it well down
      // and back so it sits beneath the CTA rather than overlapping
      // the type. Smaller scale keeps it from competing for focus.
      if (w < 768) {
        globe.position.set(1.6, -4.0, -4.5);
        globe.scale.setScalar(0.42);
      } else {
        globe.position.set(3.6, 0.2, -1);
        globe.scale.setScalar(1);
      }
    }
    resize();
    let ro = null;
    if (typeof ResizeObserver !== "undefined") { ro = new ResizeObserver(resize); ro.observe(host); }
    else window.addEventListener("resize", resize);

    // Per-frame country-label visibility: a label is visible when
    // its outward normal (from globe centre to the label) faces the
    // camera. The dot product of the normal and the view direction
    // tells us which hemisphere it sits on; we fade through a short
    // band at the limb so labels don't pop on and off.
    const _labelWorld = new THREE.Vector3();
    const _globeWorld = new THREE.Vector3();
    function updateLabelVisibility() {
      globe.getWorldPosition(_globeWorld);
      for (let i = 0; i < labelSprites.length; i++) {
        const sprite = labelSprites[i];
        sprite.getWorldPosition(_labelWorld);
        const nx = _labelWorld.x - _globeWorld.x;
        const ny = _labelWorld.y - _globeWorld.y;
        const nz = _labelWorld.z - _globeWorld.z;
        const vx = _labelWorld.x - camera.position.x;
        const vy = _labelWorld.y - camera.position.y;
        const vz = _labelWorld.z - camera.position.z;
        const nLen = Math.sqrt(nx*nx + ny*ny + nz*nz) || 1;
        const vLen = Math.sqrt(vx*vx + vy*vy + vz*vz) || 1;
        const dot  = (nx*vx + ny*vy + nz*vz) / (nLen * vLen);
        // dot <= -0.15  -> fully visible (label faces camera)
        // dot >=  0.05  -> hidden (on far side)
        let opacity;
        if (dot <= -0.15)      opacity = 1;
        else if (dot < 0.05)   opacity = (0.05 - dot) / 0.20;
        else                   opacity = 0;
        sprite.material.opacity = opacity;
        if (connectorLines[i]) connectorLines[i].material.opacity = opacity * 0.55;
      }
    }

    let raf = 0;
    function tick() {
      if (!dragging) {
        // Momentum decay; once the flick settles, fall back to a
        // brisker auto-rotate so the cosmos always feels alive.
        velY *= 0.93;
        velX *= 0.93;
        globe.rotation.y += velY + AUTO_Y;
        globe.rotation.x += velX;
      }
      updateLabelVisibility();
      // Cosmos drift — three tiers at different rates for parallax.
      starsFar.rotation.y  += 0.00035;
      starsMid.rotation.y  += 0.00055;
      starsNear.rotation.y += 0.00080;
      // Shooting stars — advance each streak, fade in/hold/out,
      // respawn when its life ends.
      for (let i = 0; i < shootingStars.length; i++) {
        const ss = shootingStars[i];
        if (ss.userData.delay > 0) { ss.userData.delay -= 1; continue; }
        ss.userData.progress += ss.userData.speed;
        const p = ss.userData.progress;
        const lf = ss.userData.lifeFade;
        const lh = ss.userData.lifeHold;
        const lo = ss.userData.lifeOut;
        const headX = ss.userData.startX + ss.userData.dirX * p;
        const headY = ss.userData.startY + ss.userData.dirY * p;
        const tailX = headX - ss.userData.dirX * ss.userData.trailLength;
        const tailY = headY - ss.userData.dirY * ss.userData.trailLength;
        const arr = ss.geometry.attributes.position.array;
        arr[0] = headX; arr[1] = headY; arr[2] = ss.userData.startZ;
        arr[3] = tailX; arr[4] = tailY; arr[5] = ss.userData.startZ;
        ss.geometry.attributes.position.needsUpdate = true;
        if (p < lf)            ss.material.opacity = p / lf;            // fade in
        else if (p < lf + lh)  ss.material.opacity = 1;                  // hold
        else if (p < lf + lh + lo)
          ss.material.opacity = 1 - (p - lf - lh) / lo;                  // fade out
        else                   resetShootingStar(ss, false);             // respawn
      }
      renderer.render(scene, camera);
      raf = requestAnimationFrame(tick);
    }
    updateLabelVisibility(); // ensure correct opacities on first frame
    if (reduce) renderer.render(scene, camera); else tick();

    return () => {
      cancelAnimationFrame(raf);
      host.removeEventListener('pointerdown', onPointerDown);
      window.removeEventListener('pointermove', onPointerMove);
      window.removeEventListener('pointerup', onPointerUp);
      window.removeEventListener('pointercancel', onPointerUp);
      if (ro) ro.disconnect(); else window.removeEventListener("resize", resize);
      renderer.dispose();
      if (renderer.domElement.parentNode === host) host.removeChild(renderer.domElement);
    };
  }, []);
  return <div ref={ref} className="tb-hero__ambient" aria-hidden="true" />;
}

<script>
/* Service-card video: lazy-load and play on hover, pause and reset on leave.
   Gracefully shows the poster image when the video file is not present. */
(function initServiceVideos() {
  function wire() {
    document.querySelectorAll('.tb-service').forEach(function (card) {
      if (card.dataset.vidWired) return;
      var video = card.querySelector('.tb-service__video');
      if (!video) return;
      card.dataset.vidWired = "1";
      var src = video.getAttribute('data-src');
      function ensureSrc() {
        if (src && video.dataset.ready === "1" && !video.getAttribute('src')) {
          video.setAttribute('src', src);
        }
      }
      card.addEventListener('mouseenter', function () {
        ensureSrc();
        var p = video.play();
        if (p && p.catch) p.catch(function () {});
      });
      card.addEventListener('mouseleave', function () {
        try { video.pause(); video.currentTime = 0; } catch (e) {}
      });
    });
  }
  wire();
  setTimeout(wire, 200);
  setTimeout(wire, 1000);
})();

/* Cinematic banner: load src and autoplay (muted) once present. */
(function initFilmstrip() {
  function go() {
    var v = document.querySelector('.tb-filmstrip__video');
    if (!v || v.dataset.fsWired) return;
    v.dataset.fsWired = "1";
    var src = v.getAttribute('data-src');
    if (src && v.dataset.ready === "1") {
      v.setAttribute('src', src);
      var p = v.play();
      if (p && p.catch) p.catch(function () {});
    }
  }
  go();
  setTimeout(go, 300);
  setTimeout(go, 1200);
})();
</script>
