function VarkBackdrop() {
  const ref = React.useRef(null);
  React.useEffect(() => {
    const canvas = ref.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    const DPR = Math.min(window.devicePixelRatio || 1, 2);
    let raf = 0, W = 1, H = 1;
    const N = 56;
    const pts = [];
    for (let i = 0; i < N; i++) pts.push({
      x: Math.random(), y: Math.random(), z: Math.random() * 0.7 + 0.3,
      vx: (Math.random() - 0.5) * 0.0007, vy: (Math.random() - 0.5) * 0.0007,
    });
    function reset() {
      W = canvas.clientWidth; H = canvas.clientHeight;
      canvas.width = Math.max(1, Math.round(W * DPR)); canvas.height = Math.max(1, Math.round(H * DPR));
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    }
    function draw() {
      ctx.clearRect(0, 0, W, H);
      for (const p of pts) {
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0) p.x = 1; else if (p.x > 1) p.x = 0;
        if (p.y < 0) p.y = 1; else if (p.y > 1) p.y = 0;
      }
      for (let i = 0; i < N; i++) {
        const a = pts[i], ax = a.x * W, ay = a.y * H;
        for (let j = i + 1; j < N; j++) {
          const b = pts[j], bx = b.x * W, by = b.y * H;
          const dx = ax - bx, dy = ay - by, d = Math.sqrt(dx * dx + dy * dy);
          if (d < 130) {
            ctx.globalAlpha = (1 - d / 130) * 0.13 * Math.min(a.z, b.z);
            ctx.strokeStyle = "#C4BFA0"; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
          }
        }
      }
      for (const p of pts) {
        ctx.globalAlpha = 0.55 * p.z;
        ctx.fillStyle = "#C4BFA0";
        ctx.beginPath(); ctx.arc(p.x * W, p.y * H, p.z * 1.7, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;
      raf = requestAnimationFrame(draw);
    }
    reset(); draw();
    let ro = null;
    if (typeof ResizeObserver !== "undefined") { ro = new ResizeObserver(reset); ro.observe(canvas); }
    else window.addEventListener("resize", reset);
    return () => {
      cancelAnimationFrame(raf);
      if (ro) ro.disconnect(); else window.removeEventListener("resize", reset);
    };
  }, []);
  return <canvas ref={ref} className="tb-vark__canvas" aria-hidden="true" />;
}

function VarkQuiz() {
  const [answers, setAnswers] = React.useState([]);
  const total = VARK_QUESTIONS.length;
  const step = answers.length;
  const done = step >= total;
  const pick = (k) => setAnswers((a) => [...a, k]);
  const back = () => setAnswers((a) => a.slice(0, -1));
  const restart = () => setAnswers([]);
  const scores = React.useMemo(() => {
    const s = { V: 0, A: 0, R: 0, K: 0 };
    answers.forEach((k) => { s[k] += 1; });
    return s;
  }, [answers]);
  const order = ["V", "A", "R", "K"].slice().sort((a, b) => scores[b] - scores[a]);
  const top = order[0];
  const multimodal = done && scores[order[1]] === scores[top];

  if (!done) {
    const cur = VARK_QUESTIONS[step];
    return (
      <div className="tb-vark__stage">
        <div className="tb-vark__card" key={step}>
          <div className="tb-vark__meter">
            <span className="tb-vark__meter-txt">Question {step + 1} of {total}</span>
            <span className="tb-vark__meter-bar"><span style={{ width: (step / total * 100) + "%" }} /></span>
          </div>
          <h3 className="tb-vark__q">{cur.q}</h3>
          <div className="tb-vark__opts">
            {cur.o.map((opt, i) => (
              <button type="button" key={i} className="tb-vark__opt" onClick={() => pick(opt[0])}>
                <span className="tb-vark__opt-tag">{opt[0]}</span>
                <span className="tb-vark__opt-txt">{opt[1]}</span>
              </button>
            ))}
          </div>
          {step > 0 && <button type="button" className="tb-vark__back" onClick={back}>{"‹"} Back</button>}
        </div>
      </div>
    );
  }

  const info = VARK_INFO[top];
  return (
    <div className="tb-vark__stage">
      <div className="tb-vark__card tb-vark__result" key="result">
        <span className="tb-vark__badge" aria-hidden="true">{VARK_ICON[top]}</span>
        <span className="tb-vark__res-tag">{multimodal ? "You're multimodal, leaning toward" : "You lean toward"}</span>
        <h3 className="tb-vark__res-name">{info.name}</h3>
        <p className="tb-vark__res-tagline">{info.tag}.</p>
        <p className="tb-vark__res-blurb">{info.blurb}</p>
        <div className="tb-vark__bars">
          {["V", "A", "R", "K"].map((k) => (
            <div className="tb-vark__bar" key={k}>
              <span className="tb-vark__bar-k">{VARK_INFO[k].name}</span>
              <span className="tb-vark__bar-track"><span className={"tb-vark__bar-fill" + (k === top ? " is-top" : "")} style={{ width: (scores[k] / total * 100) + "%" }} /></span>
              <span className="tb-vark__bar-n">{scores[k]}</span>
            </div>
          ))}
        </div>
        <div className="tb-vark__teach">
          <span className="tb-vark__teach-label">How we would teach to it</span>
          <p>{info.teach}</p>
        </div>
