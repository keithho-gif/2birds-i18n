  K: "Doing — practice, real examples and hands-on tasks.",

function VarkBackdrop() {
  const ref = React.useRef(null);
  React.useEffect(() => {
    const host = ref.current;
    if (!host || typeof THREE === "undefined") return;
    const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const COL = 0xC4BFA0;
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
    camera.position.z = 9.2;
    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    host.appendChild(renderer.domElement);

    const group = new THREE.Group();
    const ico = new THREE.IcosahedronGeometry(2.7, 1);
    group.add(new THREE.LineSegments(
      new THREE.WireframeGeometry(ico),
      new THREE.LineBasicMaterial({ color: COL, transparent: true, opacity: 0.20 })));
    group.add(new THREE.Points(ico,
      new THREE.PointsMaterial({ color: COL, size: 0.07, transparent: true, opacity: 0.55 })));

    const PN = 240, pos = new Float32Array(PN * 3);
    for (let i = 0; i < PN; i++) {
      const r = 4.0 + Math.random() * 2.6;
      const th = Math.random() * Math.PI * 2;
      const ph = Math.acos(2 * Math.random() - 1);
      pos[i * 3] = r * Math.sin(ph) * Math.cos(th);
      pos[i * 3 + 1] = r * Math.sin(ph) * Math.sin(th);
      pos[i * 3 + 2] = r * Math.cos(ph);
    }
    const cloudGeo = new THREE.BufferGeometry();
    cloudGeo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    group.add(new THREE.Points(cloudGeo,
      new THREE.PointsMaterial({ color: COL, size: 0.05, transparent: true, opacity: 0.38 })));

    group.rotation.x = 0.5;
    scene.add(group);

    function resize() {
      const w = host.clientWidth || 1, h = host.clientHeight || 1;
      renderer.setSize(w, h);
      camera.aspect = w / h; camera.updateProjectionMatrix();
    }
    resize();
    let ro = null;
    if (typeof ResizeObserver !== "undefined") { ro = new ResizeObserver(resize); ro.observe(host); }
    else window.addEventListener("resize", resize);

    let raf = 0;
    function tick() {
      group.rotation.y += 0.0016;
      group.rotation.x += 0.0006;
      renderer.render(scene, camera);
      raf = requestAnimationFrame(tick);
    }
    if (reduce) renderer.render(scene, camera); else tick();

    return () => {
      cancelAnimationFrame(raf);
      if (ro) ro.disconnect(); else window.removeEventListener("resize", resize);
      renderer.dispose();
      if (renderer.domElement.parentNode === host) host.removeChild(renderer.domElement);
    };
  }, []);
  return <div ref={ref} className="tb-vark__canvas" aria-hidden="true" />;
}

function VarkQuiz() {
  const [answers, setAnswers] = React.useState([]);
  const total = VARK_QUESTIONS.length;
  const step = answers.length;
  const done = step >= total;
  const pick = (k) => setAnswers((a) => [...a, k]);
  const back = () => setAnswers((a) => a.slice(0, -1));
  const restart = () => setAnswers([]);
  const scores = React.useMemo(() => {
    const s = { V: 0, A: 0, R: 0, K: 0 };
    answers.forEach((k) => { s[k] += 1; });
    return s;
  }, [answers]);
  const order = ["V", "A", "R", "K"].slice().sort((a, b) => scores[b] - scores[a]);
  const top = order[0];
  const multimodal = done && scores[order[1]] === scores[top];

  if (!done) {
    const cur = VARK_QUESTIONS[step];
    return (
      <div className="tb-vark__stage">
        <div className="tb-vark__card" key={step}>
          <div className="tb-vark__meter">
            <span className="tb-vark__meter-txt">Question {step + 1} of {total}</span>
            <span className="tb-vark__meter-bar"><span style={{ width: (step / total * 100) + "%" }} /></span>
          </div>
          <h3 className="tb-vark__q">{cur.q}</h3>
          <div className="tb-vark__opts">
            {cur.o.map((opt, i) => (
              <button type="button" key={i} className="tb-vark__opt" onClick={() => pick(opt[0])}>
                <span className="tb-vark__opt-tag">{VARK_ICON[opt[0]]}</span>
                <span className="tb-vark__opt-txt">{opt[1]}</span>
              </button>
            ))}
          </div>
          <div className="tb-vark__foot">
            {step > 0
              ? <button type="button" className="tb-vark__back" onClick={back}>{"‹"} Back</button>
              : <span />}
            <div className="tb-vark__live" aria-label="Your leaning so far">
              {["V", "A", "R", "K"].map((k) => (
                <span className="tb-vark__live-cell" key={k} title={VARK_INFO[k].name}>
                  <span className="tb-vark__live-ic">{VARK_ICON[k]}</span>
                  <span className="tb-vark__live-track"><span className="tb-vark__live-fill" style={{ width: (step ? Math.round(scores[k] / step * 100) : 0) + "%" }} /></span>
                </span>
              ))}
            </div>
          </div>
        </div>
      </div>
    );
  }

  const info = VARK_INFO[top];
  return (
    <div className="tb-vark__stage">
      <div className="tb-vark__card tb-vark__result" key="result">
        <span className="tb-vark__badge" aria-hidden="true">{VARK_ICON[top]}</span>
        <span className="tb-vark__res-tag">{multimodal ? "You're multimodal, leaning toward" : "You lean toward"}</span>
        <h3 className="tb-vark__res-name">{info.name}</h3>
        <p className="tb-vark__res-tagline">{info.tag}.</p>
        <p className="tb-vark__res-blurb">{info.blurb}</p>
        <div className="tb-vark__bars">
          {["V", "A", "R", "K"].map((k) => (
            <div className="tb-vark__bar" key={k}>
              <span className="tb-vark__bar-k">{VARK_INFO[k].name}</span>
              <span className="tb-vark__bar-track"><span className={"tb-vark__bar-fill" + (k === top ? " is-top" : "")} style={{ width: (scores[k] / total * 100) + "%" }} /></span>
              <span className="tb-vark__bar-n">{scores[k]}</span>
            </div>
          ))}
        </div>
        <div className="tb-vark__teach">
          <span className="tb-vark__teach-label">How we would teach to it</span>
          <p>{info.teach}</p>
        </div>
        <div className="tb-vark__about">
          <span className="tb-vark__teach-label">About the model</span>
          <p>
            VARK was set out by the New Zealand educator Neil Fleming in 1987, drawn from years of watching why a clear lesson reached some learners and slipped past others. It sorts the way we prefer to take in new material into four modes:
          </p>
          <div className="tb-vark__modes">
            {["V", "A", "R", "K"].map((k) => (
              <div className={"tb-vark__mode" + (k === top ? " is-top" : "")} key={k}>
                <span className="tb-vark__mode-icon">{VARK_ICON[k]}</span>
                <span className="tb-vark__mode-body">
                  <span className="tb-vark__mode-name">{VARK_INFO[k].name}</span>
                  <span className="tb-vark__mode-desc">{VARK_MODE_DESC[k]}</span>
                </span>
              </div>
            ))}
          </div>
          <p>
            It describes a preference, not a limit. Most people are multimodal, drawing on two or three of the modes and shifting between them with the task in front of them, which is why your result above is a leaning rather than a label. A short quiz like this is a prompt, not a diagnosis; what it points to is the route, or routes, a course should offer if it means to reach you and not just the average of the room.
          </p>
        </div>
        <p className="tb-vark__close">
          Most of us are a mix of these, which is exactly why we never build a course for one kind of learner alone. We give every lesson more than one route to the same understanding, visual, spoken, written and hands-on, so whichever way you learn, the teaching reaches you. That is the difference the right method makes.
        </p>
        <div className="tb-vark__actions">
          <a className="btn btn-on-dark" href="contact.html">Make an enquiry</a>
          <button type="button" className="btn btn-ghost-on-dark" onClick={restart}>Take it again</button>
        </div>
      </div>
    </div>
  );
}

        <section className="premium-section premium-section--bone tb-reveal">
